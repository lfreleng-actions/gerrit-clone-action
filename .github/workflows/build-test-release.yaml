---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Runs on a tag push: builds, tests and promotes the release, then
# publishes to Test PyPI and PyPI.
#
# PyPI publishing runs HERE, not in the reusable workflow. PyPI trusted
# publishing matches the OIDC job_workflow_ref claim against this
# repository, so the publish jobs must live in this caller. The reusable
# `release` job builds, tests, audits, attaches artefacts and promotes the
# draft release; the `test-pypi` and `pypi` jobs below then publish the
# run-scoped build artefact it produced, using the `tag` output it exposes.
name: 'Python Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  # Trigger on tag push events
  push:
    tags:
      - '**'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Harden-runner egress allow-list for the caller-owned publish jobs below.
  # yamllint disable-line rule:line-length
  HARDEN_RUNNER_ALLOWLIST: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@807a544b7e55a9224b2b3780e636467bd4b5b99b'  # v0.5.0

jobs:
  release:
    name: 'Build/Test/Release'
    permissions:
      contents: write       # Create the GitHub release / attach assets
      id-token: write       # OIDC for build provenance attestations
      attestations: write   # Build provenance attestations
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test-release.yaml@56d8bad2ce83729cc0858f639c18e6f3d23890fb  # v0.5.1

  test-pypi:
    name: 'Test PyPI Publishing'
    needs: release
    runs-on: 'ubuntu-latest'
    # MUST match the environment on the Test PyPI trusted publisher.
    environment:
      name: development
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5  # v0.13.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Test PyPI publishing'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pypi-publish-action@276603f5d72b11427755ef139c6fb80489cec5d9  # v0.2.0
        with:
          environment: development
          tag: ${{ needs.release.outputs.tag }}
          trusted_publishing: 'true'

  pypi:
    name: 'Release PyPI Package'
    needs:
      - release
      - test-pypi
    runs-on: 'ubuntu-latest'
    # MUST match the environment on the PyPI trusted publisher.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list (block mode)'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@51ef68401547a8b648275129b9a21544612596d5  # v0.13.1
        with:
          config: ${{ env.HARDEN_RUNNER_ALLOWLIST }}
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'PyPI release'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/pypi-publish-action@276603f5d72b11427755ef139c6fb80489cec5d9  # v0.2.0
        with:
          environment: production
          tag: ${{ needs.release.outputs.tag }}
          trusted_publishing: 'true'
          attestations: true
