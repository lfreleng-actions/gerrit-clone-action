---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
#
# Interim regime: anonymous HTTPS clones of a few small projects on the
# public O-RAN-SC Gerrit, run for both the composite action and the CLI.
# No credentials are used, so the job is safe to run on pull requests.
# SSH coverage returns with a disposable Gerrit container and a per-run
# key; the content-filter tests return once they pass against bare
# mirror clones.
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

env:
  GERRIT_HOST: "gerrit.o-ran-sc.org"
  # Small, active projects; ric-plt/* and com/* exercise nested paths.
  # Keep the clone set small: this runs against a production server.
  TEST_PROJECTS: "ric-plt/ricctl,ric-plt/conflictmgr,com/golog"
  EXPECTED_COUNT: "3"

jobs:
  tests:
    name: "Test Gerrit Clone"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'audit'

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pin the installer too; the action SHA alone leaves uv floating.
          version: '0.13.4'
          python-version: '3.11'

      - name: "Install gerrit-clone CLI"
        shell: bash
        run: |
          # Hash-pinned via uv.lock; --locked rejects lockfile drift.
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: "Test GitHub Action: gerrit.o-ran-sc.org [HTTPS]"
        id: action-https
        uses: $/
        with:
          host: ${{ env.GERRIT_HOST }}
          output-path: "action-https"
          include-projects: ${{ env.TEST_PROJECTS }}
          use-https: "true"

      - name: "Test CLI Tool: gerrit.o-ran-sc.org [HTTPS]"
        shell: bash
        run: |
          gerrit-clone clone \
            --host "$GERRIT_HOST" \
            --output-path "cli-https" \
            --threads "2" \
            --https \
            --skip-archived \
            --include-projects "$TEST_PROJECTS"

      - name: "Validate clone results [HTTPS]"
        shell: bash
        env:
          ACTION_MANIFEST: ${{ steps.action-https.outputs.manifest-path }}
        run: |
          # Check each run's manifest counts and that every requested
          # project is a git repository at its nested path.
          status=0
          for target in "action-https:$ACTION_MANIFEST" \
                        "cli-https:cli-https/clone-manifest.json"; do
            dir="${target%%:*}"
            manifest="${target#*:}"
            if [ ! -f "$manifest" ]; then
              echo "::error::$dir: manifest not found ($manifest)"
              status=1
              continue
            fi
            total=$(jq -r '.total' "$manifest")
            ok=$(jq -r '.succeeded' "$manifest")
            failed=$(jq -r '.failed' "$manifest")
            if [ "$total" != "$EXPECTED_COUNT" ] \
              || [ "$ok" != "$EXPECTED_COUNT" ] || [ "$failed" != "0" ]; then
              echo "::error::$dir: total=$total succeeded=$ok" \
                "failed=$failed (expected $EXPECTED_COUNT/$EXPECTED_COUNT/0)"
              status=1
            fi
            IFS=',' read -ra projects <<< "$TEST_PROJECTS"
            for project in "${projects[@]}"; do
              # An empty prefix means the directory is a repository
              # root; a plain directory would otherwise pass by
              # resolving to the checkout's own .git.
              prefix=$(git -C "$dir/$project" rev-parse --show-prefix \
                2>/dev/null) || prefix="(not found)"
              if [ -n "$prefix" ]; then
                echo "::error::$dir: $project is not a git repository"
                status=1
              fi
            done
            {
              echo "### $dir"
              echo "- Cloned: $ok/$total (failed: $failed)"
              echo "- Size: $(du -sh "$dir" | awk '{print $1}')"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
